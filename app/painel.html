const rkEng=p=>/stor/.test(p.kind)?(+p.replies||0)*3+(+p.shares||0)*3+(+p.follows||0)*5:(+p.likes||0)+(+p.comments||0)*2+(+p.saved||0)*3+(+p.shares||0)*3;
