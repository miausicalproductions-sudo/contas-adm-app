 for(const k in K)(r[k]||[]).forEach(x=>{if(P[K[k]+x.id])return;const l=S[k].find(o=>o.id==x.id);if(!l)S[k].push(x);else if(x.ts>l.ts)Object.assign(l,x)});

function setState(p){const now=Date.now();for(const k in K){if(!p[k])continue;const old=Object.fromEntries(S[k].map(o=>[o.id,o]));
 const nw=p[k].map(o=>{const q=old[o.id];if(!q||JSON.stringify({...q,ts:0,eid:0})!=JSON.stringify({...o,ts:0,eid:0})){o.ts=now;P[K[k]+o.id]=1}return o});

const WK_CODE="// Studios Miau — Worker da Cloudflare (grátis)\n// 1) Recebe os avisos da Meta (WhatsApp dos clientes) e do Telegram e repassa ao Apps Script na hora.\n//    O Apps Script não consegue responder direto (o Google redireciona o endereço), por isso este intermediário.\n// 2) Página do Story (/s): a arte pronta para mandar aos Stories do Instagram, as telas para copiar e o botão \"Postei\".\n//\n// Variáveis (opcional: o painel já preenche os valores abaixo no botão \"Copiar o código pronto\"):\n//   GAS_URL      = endereço do Apps Script, terminando em /exec\n//   GAS_KEY      = a chave de acesso do painel (Config → Copiar a chave)\n//   VERIFY_TOKEN = o \"token de verificação\" mostrado no painel (Config → WhatsApp dos clientes)\n//   APP_SECRET   = a chave secreta do app da Meta (Configurações do app → Básico → Chave secreta do app)\n\n// O painel já preenche estes valores no botão \"Copiar o código pronto\" (aí não precisa criar as variáveis na Cloudflare)\nconst CFG = { GAS_URL: '', GAS_KEY: '', VERIFY_TOKEN: '', APP_SECRET: '' };\n\nexport default {\n  async fetch(req, env0, ctx) {\n    const env = { GAS_URL: (env0 && env0.GAS_URL) || CFG.GAS_URL, GAS_KEY: (env0 && env0.GAS_KEY) || CFG.GAS_KEY, VERIFY_TOKEN: (env0 && env0.VERIFY_TOKEN) || CFG.VERIFY_TOKEN, APP_SECRET: (env0 && env0.APP_SECRET) || CFG.APP_SECRET };\n    const url = new URL(req.url), path = url.pathname.replace(/\\/+$/, '') || '/';\n\n    // Página do Story e arquivos\n    if (req.method === 'GET' && path === '/s') return storyPage(url, env);\n    if (req.method === 'GET' && path === '/f') return storyFile(url, env);\n    if (req.method === 'POST' && path === '/done') return storyDone(url, env);\n    if (req.method === 'POST' && path === '/n') return ntfyRelay(req, env);       // avisos do iPhone: o Apps Script manda por aqui\n\n    // Telegram (modo instantâneo): o segredo vem no cabeçalho e o Apps Script confere\n    if (req.method === 'POST' && path === '/tg') {\n      const sec = const THB={},THQ={},THRX=/^https:\/\/drive\.google\.com\/thumbnail\?id=([\w-]+)&sz=w(\d+)/,TH0='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';let THT=0;
function thGiveUp(img){delete img.dataset.thq;if(img.onerror){try{img.onerror.call(img,new Event('error'))}catch(e){}}else img.style.visibility='hidden'}
function thWant(img){const m=String(img.getAttribute('src')||'').match(THRX);if(!m)return;const id=m[1],sz=+m[2]>480?800:+m[2]>240?480:240,k=sz+'_'+id;
 if(THB[k]){img.src=THB[k];return}if(THB[k]===''||!(S.cfg.url||GAS))return thGiveUp(img);
 img.dataset.thq=k;img.src=TH0;(THQ[sz]=THQ[sz]||new Set()).add(id);clearTimeout(THT);THT=setTimeout(thRun,80)}
function thRun(){Object.keys(THQ).forEach(sz=>{const L=[...THQ[sz]];delete THQ[sz];for(let i=0;i<L.length;i+=24){const ids=L.slice(i,i+24);
 const done=th=>ids.forEach(id=>{const k=sz+'_'+id,v=(th||{})[id]||'';THB[k]=v;document.querySelectorAll('img[data-thq="'+k+'"]').forEach(im=>{if(v){im.src=v;delete im.dataset.thq}else thGiveUp(im)})});
 api({action:'drvThumbs',ids,sz:+sz}).then(r=>done(r.th)).catch(()=>done(null))}})}
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName=='IMG'&&!t.dataset.thq&&THRX.test(t.getAttribute('src')||'')){e.stopPropagation();thWant(t)}},true);
if(IS_APP)new MutationObserver(ms=>{for(const m of ms){if(m.type=='attributes'){if(m.target.tagName=='IMG')thWant(m.target)}else m.addedNodes.forEach(n=>{if(n.nodeType!=1)return;if(n.tagName=='IMG')thWant(n);else if(n.querySelectorAll)n.querySelectorAll('img[src^="https://drive.google.com/thumbnail"]').forEach(thWant)})}}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src']});

const DEFD={'Gancho':'Conteúdo feito para prender a atenção nos primeiros 2 segundos. Entregue 5 opções de frase de abertura curtas (até 8 palavras), cada uma com um tom diferente (curiosidade, pergunta, polêmica leve, promessa, humor) e diga qual funciona melhor e por quê. Depois mostre como seguir o conteúdo a partir do gancho escolhido.',

'Bastidores':'Mostrar o dia a dia e as pessoas por trás da empresa, em tom leve e próximo. Entregue sugestões de cenas para gravar, falas curtas e legenda informal.',
'Promoção':'Venda direta. Entregue a oferta com clareza, o benefício principal, prazo ou urgência verdadeira e chamada para ação com o canal de compra. Não prometa o que a empresa não pode cumprir.',
'Educativo':'Explicar um assunto com precisão e tom acessível. Entregue em tópicos (problema, explicação, exemplo, resumo) e avise quando algo precisar de confirmação de um profissional.',

'Notícia':'Comentar um assunto atual. Entregue o contexto em 2 linhas, a ligação com a empresa e os cuidados com informação a confirmar.'};

function mkBatch(c,L){const cats=[...new Set(L.map(p=>(I_(p.idea)||{}).tag).filter(t=>t&&catDesc(t)))];

 `\n\nEscreva os textos dos ${L.length} posts abaixo. Responda SOMENTE com um bloco por post, na mesma ordem, exatamente neste formato, sem markdown e sem nenhum texto antes ou depois dos blocos:\n\n=== CÓDIGO DO POST ===\nLEGENDA:\n(legenda pronta para publicar: gancho na primeira linha, texto curto, chamada para ação${c.fone||c.end?' (use o telefone/WhatsApp ou o endereço quando fizer sentido)':''} e de 3 a 5 hashtags no final)\nALT:\n(texto alternativo da imagem, em uma frase)\n\nPara Stories, troque LEGENDA por TELAS (o texto curto de cada tela, uma por linha, no formato "Tela 1: ...") e não escreva ALT. Se o Story tiver figurinha, acrescente FIGURINHA: com a pergunta e as opções.\nUse exatamente o código de cada post entre os sinais ===. Não invente preços, promoções, datas ou dados que não estejam aqui. Se faltar uma informação, escreva [CONFIRMAR: o que falta] dentro do texto.\n\nPOSTS\n`+
 L.map(p=>{const i=I_(p.idea),t=th(p);return['\n--- post '+p.id+' ---','Formato: '+TYPES[p.type],'Data: '+fdt(p),'Assunto: '+(p.txt||'(sem texto)'),p.how&&'Como será: '+p.how,p.info&&'Roteiro e detalhes: '+p.info,t&&'Tema do dia: '+t,i&&i.tag&&'Categoria: '+i.tag,p.fig&&'Figurinha: '+FIG[p.fig]+(p.figtx?' ('+p.figtx+')':''),p.cap&&'Texto atual (melhore mantendo a ideia): '+p.cap].filter(Boolean).join('\n')}).join('\n')}
/* lê a resposta: "=== código ===" abre um bloco; LEGENDA/TELAS, ALT e FIGURINHA abrem as partes (tolera negrito e # do markdown) */
function parseBatch(t){const out={},H=/^[\s*#>`_]*={2,}\s*(?:post\s+)?([\w-]+)\s*={2,}[\s*`_]*$/i,F=/^[\s*_#]*(legenda|telas|alt|texto alternativo|figurinha)[\s*_]*:[\s*_]*(.*)$/i;let cur=null,sec='cap';
 String(t).replace(/\r/g,'').split('\n').forEach(l=>{const h=l.match(H);if(h){const k=h[1].toLowerCase();if(k=='fim'){cur=null;return}cur=out[k]=out[k]||{cap:'',alt:'',figtx:''};sec='cap';return}if(!cur)return;
  const m=l.match(F);if(m){const n=m[1].toLowerCase();sec=n=='alt'||n=='texto alternativo'?'alt':n=='figurinha'?'figtx':'cap';l=m[2]}cur[sec]+=(cur[sec]?'\n':'')+l});
 Object.values(out).forEach(o=>{for(const k in o)o[k]=o[k].trim()});return out}

 if(!LT.res){h+=L.length?`<div>${L.map(p=>`<label class=lti><input type=checkbox data-lp="${p.id}"${LT.on.has(p.id)?' checked':''}><span>${lab(p)}<br><span class=mu>${p.cap?'já tem legenda (marque para refazer)':'sem legenda'}${p.fig?' · MANUAL, figurinha: '+esc(FIG[p.fig]):''}${p.how?' · '+esc(p.how):''}</span></span></label>`).join('')}</div>
  <div class=row><button class=btn data-act=lgen>${IK.ai} Gerar o pedido e abrir o chat (${LT.on.size} ${LT.on.size==1?'post':'posts'})</button><button class=chip data-act=lnone>Só os sem legenda</button><button class=chip data-act=lall>Marcar todos</button></div>`:`<p class=mu style="margin:0">Nenhum post pendente neste período. Os posts já marcados como Postado ficam de fora.</p>`;
  h+=`<label class=blk><b>Resposta do Claude</b><span class=mu>Copie a resposta inteira (botão de copiar embaixo da mensagem) e cole aqui.</span><textarea id=lpaste style="min-height:130px" placeholder="=== código do post ===&#10;LEGENDA:&#10;…">${esc(LT.paste)}</textarea></label>

 else{const ids=Object.keys(LT.res),P=ids.map(k=>[k,S.posts.find(p=>String(p.id).toLowerCase()==k&&!p.del)]),ok=P.filter(x=>x[1]),miss=[...LT.on].filter(id=>!LT.res[String(id).toLowerCase()]).map(Po).filter(Boolean),unk=P.filter(x=>!x[1]).map(x=>x[0]);
  h+=`<p class=mu style="margin:0">Revise e ajuste o texto se precisar. Nada é salvo antes de você clicar em Salvar.</p>`+ok.map(([k,p])=>{const r=LT.res[k],st=p.type=='stories';return`<div class=ltr><div>${lab(p)}</div>${p.cap?'<small style="color:#C62F4A">Vai substituir o texto que este post já tem.</small>':''}<label class=blk>${st?'Texto de cada tela':'Legenda'}<textarea data-lc="${k}" data-k=cap>${esc(r.cap)}</textarea></label>${st?`<label class=blk>Texto da figurinha${p.fig?'':' (se preencher, o Story vira MANUAL)'}<input data-lc="${k}" data-k=figtx value="${esc(r.figtx)}"></label>`:`<label class=blk>Texto alternativo<input data-lc="${k}" data-k=alt value="${esc(r.alt)}"></label>`}</div>`}).join('')+
